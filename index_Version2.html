<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le Sodine</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf5;
      color: #1f2937;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid #f1f1f1;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      gap: 12px;
    }

    .brand {
      font-size: 30px;
      font-weight: 700;
      color: #ea580c;
    }

    .tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tab-btn {
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      background: white;
      color: #374151;
      padding: 10px 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #f97316;
      color: white;
      border-color: #f97316;
    }

    .tab-content {
      display: none;
      margin-top: 24px;
    }

    .tab-content.active {
      display: block;
    }

    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    .panel {
      background: white;
      border: 1px solid #f3f4f6;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .food-card {
      border: 1px solid #eeeeee;
      background: white;
      border-radius: 16px;
      overflow: hidden;
    }

    .food-image {
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe4d6, #fff1d6);
      font-size: 46px;
    }

    .food-body {
      padding: 16px;
    }

    .food-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .food-name {
      font-size: 18px;
      font-weight: 700;
    }

    .food-price {
      color: #ea580c;
      font-weight: 700;
      font-size: 18px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover {
      opacity: 0.97;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #f97316;
      color: white;
      width: 100%;
    }

    .btn-success {
      background: #22c55e;
      color: white;
    }

    .btn-warning {
      background: #f59e0b;
      color: white;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #f3f4f6;
      gap: 12px;
    }

    .cart-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .qty-box {
      display: inline-flex;
      align-items: center;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
      background: white;
    }

    .qty-box button {
      width: 32px;
      height: 32px;
      border: none;
      background: #f8fafc;
      font-size: 18px;
      cursor: pointer;
    }

    .qty-box span {
      min-width: 32px;
      text-align: center;
      font-weight: 700;
    }

    .summary-row, .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 16px;
    }

    .summary-total {
      border-top: 1px solid #eee;
      padding-top: 14px;
      margin-top: 18px;
      font-size: 22px;
      font-weight: 700;
    }

    .checkout-form {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .checkout-form input, .checkout-form select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: white;
      font-size: 16px;
      outline: none;
    }

    .orders-list {
      display: grid;
      gap: 16px;
      margin-top: 16px;
    }

    .order-card {
      background: white;
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 16px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .status-badge {
      display: inline-block;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-pending { background: #fef3c7; color: #92400e; }
    .status-accepted { background: #dbeafe; color: #1d4ed8; }
    .status-preparing { background: #fce7f3; color: #be185d; }
    .status-ready { background: #dcfce7; color: #166534; }
    .status-delivered { background: #d1fae5; color: #065f46; }

    .status-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .status-actions button {
      flex: 1;
      min-width: 90px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .stat-card {
      background: linear-gradient(135deg, #fff7ed, #fffbeb);
      border: 1px solid #fed7aa;
      border-radius: 16px;
      padding: 18px;
    }

    .stat-label {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-number {
      font-size: 32px;
      font-weight: 800;
      color: #c2410c;
    }

    .empty-state {
      padding: 28px 16px;
      text-align: center;
      border: 1px dashed #ddd;
      border-radius: 12px;
      color: #6b7280;
      background: white;
    }

    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">Le Sodine</div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="customer">Customer</button>
        <button class="tab-btn" data-tab="restaurant">Restaurant</button>
        <button class="tab-btn" data-tab="admin">Admin</button>
      </div>
    </div>
  </div>

  <div class="container">
    <section id="customer" class="tab-content active">
      <div class="layout">
        <div class="panel">
          <h2>Menu</h2>
          <div id="menuList" class="menu-grid"></div>
        </div>

        <div class="panel">
          <h2>Your Cart</h2>
          <div id="cartList"></div>

          <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal">৳0</span>
          </div>

          <div class="summary-total">
            <span>Total</span>
            <span id="cartTotal">৳0</span>
          </div>

          <form id="checkoutForm" class="checkout-form">
            <input type="text" id="customerName" placeholder="Customer Name" required />
            <input type="tel" id="customerPhone" placeholder="Phone Number" required />
            <input type="text" id="deliveryAddress" placeholder="Delivery Address" required />
            <select id="paymentMethod" required>
              <option value="">Select Payment Method</option>
              <option value="COD">Cash on Delivery</option>
              <option value="BKash">bKash</option>
              <option value="Nagad">Nagad</option>
              <option value="Card">Card</option>
            </select>
            <button type="submit" class="btn btn-primary">Place Order</button>
          </form>
        </div>
      </div>
    </section>

    <section id="restaurant" class="tab-content">
      <div class="panel">
        <h2>Restaurant Dashboard</h2>
        <div id="restaurantOrders" class="orders-list"></div>
      </div>
    </section>

    <section id="admin" class="tab-content">
      <div class="panel">
        <h2>Admin Dashboard</h2>

        <div class="admin-grid">
          <div class="stat-card">
            <div class="stat-label">Total Revenue</div>
            <div id="totalRevenue" class="stat-number">৳0</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Delivered Orders</div>
            <div id="deliveredCount" class="stat-number">0</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Total Customers</div>
            <div id="customerCount" class="stat-number">0</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Recent Orders</div>
            <div id="recentOrderCount" class="stat-number">0</div>
          </div>
        </div>

        <div id="adminOrders" class="orders-list" style="margin-top:24px;"></div>
      </div>
    </section>
  </div>

  <script>
    const defaultMenu = [
      { id: 1, name: "Chicken Burger", price: 320, emoji: "🍔" },
      { id: 2, name: "Beef Pizza", price: 550, emoji: "🍕" },
      { id: 3, name: "Classic Pasta", price: 420, emoji: "🍝" },
      { id: 4, name: "Crispy Fries", price: 180, emoji: "🍟" },
      { id: 5, name: "Chicken Wrap", price: 260, emoji: "🌯" },
      { id: 6, name: "Cold Coffee", price: 220, emoji: "☕" }
    ];

    let menu = [...defaultMenu];
    let cart = [];
    let orders = [];

    const CART_KEY = "le_sodine_cart";
    const ORDER_KEY = "le_sodine_orders";

    function money(value) {
      return "৳" + Number(value || 0).toLocaleString();
    }

    function loadCart() {
      const data = localStorage.getItem(CART_KEY);
      cart = data ? JSON.parse(data) : [];
    }

    function saveCart() {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }

    function loadOrders() {
      const data = localStorage.getItem(ORDER_KEY);
      orders = data ? JSON.parse(data) : [];
    }

    function saveOrders() {
      localStorage.setItem(ORDER_KEY, JSON.stringify(orders));
    }

    function findMenuItem(id) {
      return menu.find(item => item.id === id);
    }

    function getCartSubtotal() {
      return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    }

    function renderMenu() {
      const list = document.getElementById("menuList");
      list.innerHTML = "";

      menu.forEach(item => {
        const card = document.createElement("div");
        card.className = "food-card";

        card.innerHTML = `
          <div class="food-image">${item.emoji}</div>
          <div class="food-body">
            <div class="food-header">
              <div class="food-name">${item.name}</div>
              <div class="food-price">${money(item.price)}</div>
            </div>
            <button class="btn btn-primary add-to-cart" data-id="${item.id}">Add to Cart</button>
          </div>
        `;

        list.appendChild(card);
      });
    }

    function renderCart() {
      const cartList = document.getElementById("cartList");
      const subtotal = document.getElementById("subtotal");
      const total = document.getElementById("cartTotal");

      if (!cart.length) {
        cartList.innerHTML = '<div class="empty-state">Cart is empty.</div>';
      } else {
        cartList.innerHTML = cart.map(item => `
          <div class="cart-item">
            <div>
              <div class="cart-name">${item.name}</div>
              <div style="color:#6b7280;">${money(item.price)} each</div>
            </div>

            <div class="qty-box">
              <button type="button" class="minus-qty" data-id="${item.id}">-</button>
              <span>${item.qty}</span>
              <button type="button" class="plus-qty" data-id="${item.id}">+</button>
            </div>
          </div>
        `).join("");
      }

      const totalAmount = getCartSubtotal();
      subtotal.textContent = money(totalAmount);
      total.textContent = money(totalAmount);
    }

    function addToCart(id) {
      const item = findMenuItem(id);
      if (!item) return;

      const existing = cart.find(i => i.id === id);
      if (existing) existing.qty += 1;
      else cart.push({ id: item.id, name: item.name, price: item.price, qty: 1 });

      saveCart();
      renderCart();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;

      item.qty += delta;

      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
      }

      saveCart();
      renderCart();
    }

    function renderRestaurantOrders() {
      const container = document.getElementById("restaurantOrders");

      if (!orders.length) {
        container.innerHTML = '<div class="empty-state">No orders yet.</div>';
        return;
      }

      const sorted = [...orders].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      container.innerHTML = sorted.map(order => {
        const statusKey = (order.status || "Pending").toLowerCase().replace(/\s+/g, "-");
        const itemsText = order.items.map(i => `${i.name} x${i.qty}`).join(", ");

        return `
          <div class="order-card">
            <div class="order-top">
              <div>
                <strong>Order #${order.id}</strong><br>
                <small style="color:#6b7280;">${order.customerName} • ${order.customerPhone}</small>
              </div>
              <span class="status-badge status-${statusKey}">${order.status}</span>
            </div>

            <div style="color:#374151; line-height:1.7;">
              <strong>Address:</strong> ${order.deliveryAddress}<br>
              <strong>Payment:</strong> ${order.paymentMethod}<br>
              <strong>Items:</strong> ${itemsText}<br>
              <strong>Total:</strong> ${money(order.total)}
            </div>

            <div class="status-actions">
              <button class="btn btn-warning order-status" data-order-id="${order.id}" data-status="Accepted">Accepted</button>
              <button class="btn btn-warning order-status" data-order-id="${order.id}" data-status="Preparing">Preparing</button>
              <button class="btn btn-success order-status" data-order-id="${order.id}" data-status="Ready">Ready</button>
              <button class="btn btn-danger order-status" data-order-id="${order.id}" data-status="Delivered">Delivered</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderAdminDashboard() {
      const totalRevenue = document.getElementById("totalRevenue");
      const deliveredCount = document.getElementById("deliveredCount");
      const customerCount = document.getElementById("customerCount");
      const recentCount = document.getElementById("recentOrderCount");
      const adminOrders = document.getElementById("adminOrders");

      const deliveredOrders = orders.filter(order => order.status === "Delivered");
      const revenue = deliveredOrders.reduce((sum, order) => sum + Number(order.total || 0), 0);
      const uniqueCustomers = new Set(
        orders
          .map(order => String(order.customerName || "").trim())
          .filter(Boolean)
      ).size;

      const recent = [...orders].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5);

      totalRevenue.textContent = money(revenue);
      deliveredCount.textContent = deliveredOrders.length;
      customerCount.textContent = uniqueCustomers;
      recentCount.textContent = recent.length;

      if (!recent.length) {
        adminOrders.innerHTML = '<div class="empty-state">No recent orders.</div>';
        return;
      }

      adminOrders.innerHTML = recent.map(order => {
        const statusKey = (order.status || "Pending").toLowerCase().replace(/\s+/g, "-");
        return `
          <div class="order-card">
            <div class="order-top">
              <div>
                <strong>${order.customerName}</strong><br>
                <small style="color:#6b7280;">Order #${order.id}</small>
              </div>
              <span class="status-badge status-${statusKey}">${order.status}</span>
            </div>

            <div style="color:#374151; line-height:1.7;">
              <strong>Items:</strong> ${order.items.map(i => `${i.name} x${i.qty}`).join(", ")}<br>
              <strong>Total:</strong> ${money(order.total)}<br>
              <strong>Payment:</strong> ${order.paymentMethod}
            </div>
          </div>
        `;
      }).join("");
    }

    function createNewOrder(order) {
      orders.push(order);
      saveOrders();
      renderRestaurantOrders();
      renderAdminDashboard();
    }

    function switchTab(tabName) {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tabName);
      });

      document.querySelectorAll(".tab-content").forEach(content => {
        content.classList.toggle("active", content.id === tabName);
      });
    }

    function bindEvents() {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => switchTab(btn.dataset.tab));
      });

      document.addEventListener("click", (e) => {
        if (e.target.classList.contains("add-to-cart")) {
          const id = Number(e.target.dataset.id);
          addToCart(id);
        }

        if (e.target.classList.contains("plus-qty")) {
          const id = Number(e.target.dataset.id);
          changeQty(id, 1);
        }

        if (e.target.classList.contains("minus-qty")) {
          const id = Number(e.target.dataset.id);
          changeQty(id, -1);
        }

        if (e.target.classList.contains("order-status")) {
          const orderId = Number(e.target.dataset.orderId);
          const status = e.target.dataset.status;

          const target = orders.find(o => o.id === orderId);
          if (target) {
            target.status = status;
            saveOrders();
            renderRestaurantOrders();
            renderAdminDashboard();
          }
        }
      });

      document.getElementById("checkoutForm").addEventListener("submit", (e) => {
        e.preventDefault();

        if (!cart.length) {
          alert("Cart is empty.");
          return;
        }

        const customerName = document.getElementById("customerName").value.trim();
        const customerPhone = document.getElementById("customerPhone").value.trim();
        const deliveryAddress = document.getElementById("deliveryAddress").value.trim();
        const paymentMethod = document.getElementById("paymentMethod").value;

        if (!customerName || !customerPhone || !deliveryAddress || !paymentMethod) {
          alert("Please fill all checkout fields.");
          return;
        }

        const newOrder = {
          id: Date.now(),
          customerName,
          customerPhone,
          deliveryAddress,
          paymentMethod,
          status: "Pending",
          items: cart.map(item => ({
            id: item.id,
            name: item.name,
            qty: item.qty,
            price: item.price
          })),
          total: getCartSubtotal(),
          createdAt: new Date().toISOString()
        };

        createNewOrder(newOrder);

        cart = [];
        saveCart();
        renderCart();

        document.getElementById("checkoutForm").reset();
        switchTab("restaurant");
        alert("Order placed successfully!");
      });
    }

    function init() {
      loadCart();
      loadOrders();
      renderMenu();
      renderCart();
      renderRestaurantOrders();
      renderAdminDashboard();
      bindEvents();
    }

    init();
  </script>
</body>
</html>

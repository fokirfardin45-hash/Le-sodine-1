<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le-sodine</title>
    <style>
      :root {
        --bg: #f2f1f0;
        --panel: #f8f5f3;
        --white: #ffffff;
        --text: #2a1d1a;
        --muted: #7a6e6a;
        --primary: #b62d5d;
        --primary-2: #8b2148;
        --accent: #f0b2c4;
        --gold: #d9a45e;
        --success: #1e9d5e;
        --warn: #e7a600;
        --danger: #c53939;
        --shadow: 0 12px 26px rgba(67, 32, 34, 0.12);
        --radius: 24px;
        --soft-radius: 18px;
        --bottom-nav-h: 76px;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #dfe0e2;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        color: var(--text);
      }

      .app {
        width: 100%;
        max-width: 450px;
        min-height: 100vh;
        background: var(--bg);
        position: relative;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.04);
        padding-bottom: calc(var(--bottom-nav-h) + 26px);
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(35, 30, 30, 0.92);
        backdrop-filter: blur(8px);
        color: #fff;
        padding: 14px 16px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }

      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 0;
      }

      .brand-box {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f5d7dd, #d5d7db);
        color: var(--primary-2);
        font-size: 1.2rem;
        overflow: hidden;
        flex-shrink: 0;
      }

      .brand-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .brand-text {
        font-size: 0.86rem;
        color: rgba(255,255,255,0.7);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .brand-text strong {
        display: block;
        color: #fff;
        font-size: 1rem;
      }

      .staff-btn {
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, #ffb174, #f98752);
        color: #311b17;
        font-weight: 700;
        padding: 8px 12px;
        font-size: 0.77rem;
        cursor: pointer;
      }

      .page {
        padding: 16px 14px 28px;
      }

      .hero {
        background: linear-gradient(135deg, #b62d5d, #8b2148);
        color: #fff;
        border-radius: 26px;
        padding: 18px 16px;
        box-shadow: var(--shadow);
        margin-bottom: 16px;
      }

      .hero h1 {
        margin: 0 0 8px;
        font-size: 1.55rem;
        line-height: 1.15;
      }

      .hero p {
        margin: 0;
        font-size: 0.88rem;
        line-height: 1.5;
        color: rgba(255,255,255,0.9);
      }

      .chip-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 18px 0 12px;
      }

      .chip {
        border: 1px solid rgba(182,45,93,0.17);
        border-radius: 999px;
        padding: 8px 10px;
        background: rgba(255,255,255,0.75);
        font-size: 0.75rem;
        color: var(--primary-2);
        font-weight: 700;
      }

      .section {
        background: var(--panel);
        border-radius: var(--radius);
        padding: 14px 12px;
        box-shadow: 0 8px 18px rgba(44, 29, 26, 0.04);
        margin-bottom: 16px;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }

      .section-title h2 {
        margin: 0;
        font-size: 1.05rem;
      }

      .tiny {
        font-size: 0.72rem;
        color: var(--muted);
      }

      .menu-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .menu-item {
        display: flex;
        align-items: center;
        background: var(--white);
        border-radius: var(--soft-radius);
        padding: 10px;
        box-shadow: 0 8px 18px rgba(42,29,26,0.05);
      }

      .menu-item img {
        width: 78px;
        height: 78px;
        object-fit: cover;
        border-radius: 14px;
        flex-shrink: 0;
      }

      .menu-info {
        flex: 1;
        min-width: 0;
        margin-left: 12px;
      }

      .menu-info h3 {
        margin: 0 0 4px;
        font-size: 0.96rem;
      }

      .menu-info p {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.76rem;
        line-height: 1.4;
      }

      .menu-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .price {
        color: var(--primary);
        font-weight: 700;
        font-size: 1.02rem;
      }

      .qty-box {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 6px;
        border-radius: 999px;
        background: #f7ecef;
      }

      .qty-btn {
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 50%;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      .qty-value {
        min-width: 18px;
        text-align: center;
        font-weight: 700;
        color: var(--primary-2);
      }

      .summary-box {
        background: #fff;
        border-radius: 18px;
        padding: 14px 12px;
        border: 1px dashed rgba(182,45,93,0.35);
      }

      .summary-list {
        list-style: none;
        padding: 0;
        margin: 0 0 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: var(--text);
        font-size: 0.82rem;
      }

      .summary-list li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      .summary-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 12px;
        border-top: 1px solid rgba(0,0,0,0.08);
        font-weight: 700;
      }

      .form-group {
        margin-top: 12px;
      }

      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.72rem;
        color: var(--muted);
        font-weight: 700;
        text-transform: uppercase;
      }

      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        border: 1px solid rgba(42,29,26,0.12);
        border-radius: 12px;
        background: #fff;
        padding: 11px 12px;
        font-size: 0.92rem;
        color: var(--text);
        resize: vertical;
      }

      textarea {
        min-height: 72px;
      }

      .primary-btn {
        width: 100%;
        border: 0;
        background: linear-gradient(135deg, #b62d5d, #8b2148);
        color: #fff;
        border-radius: 16px;
        padding: 14px 16px;
        margin-top: 14px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }

      .hidden {
        display: none !important;
      }

      .staff-panel {
        background: #fff;
        border-radius: 24px;
        padding: 14px 12px;
        box-shadow: 0 8px 18px rgba(44,29,26,0.04);
      }

      .order-card {
        background: #fff7f8;
        border: 1px solid rgba(182,45,93,0.12);
        border-radius: 18px;
        padding: 12px;
        margin-bottom: 12px;
      }

      .order-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }

      .order-id {
        font-weight: 700;
        font-size: 0.9rem;
      }

      .status-badge {
        border-radius: 999px;
        padding: 5px 8px;
        font-size: 0.7rem;
        font-weight: 700;
        color: #fff;
      }

      .status-pending { background: var(--warn); }
      .status-preparing { background: #2a7de1; }
      .status-complete { background: var(--success); }

      .order-card p {
        margin: 3px 0;
        color: var(--text);
        font-size: 0.76rem;
        line-height: 1.45;
      }

      .status-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      .status-actions button {
        flex: 1;
        border: 0;
        border-radius: 10px;
        padding: 8px 6px;
        font-weight: 700;
        cursor: pointer;
        color: #fff;
      }

      .prep { background: #2a7de1; }
      .done { background: var(--success); }

      @media (max-width: 380px) {
        .topbar-inner {
          gap: 8px;
        }

        .brand-text {
          font-size: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand-wrap">
            <div class="brand-box">🥪</div>
            <div class="brand-text">
              <strong>Le-sodine</strong>
              Panini • Kebab • Delivery
            </div>
          </div>
          <button class="staff-btn" onclick="openStaffPanel()">Staff</button>
        </div>
      </header>

      <main class="page">
        <section id="customerView">
          <div class="hero">
            <h1>Ordina subito</h1>
            <p>Panini artigianali, kebab, bibite e consegna veloce a Morolo, Supino e Ferentino.</p>
          </div>

          <div class="chip-row">
            <div class="chip">🍔 Panini</div>
            <div class="chip">🥙 Kebab</div>
            <div class="chip">🥤 Bevande</div>
            <div class="chip">🚚 Consegna</div>
          </div>

          <section class="section">
            <div class="section-title">
              <h2>Menù</h2>
              <span class="tiny">Tutto freschissimo</span>
            </div>
            <div class="menu-list" id="menuList"></div>
          </section>

          <section class="section">
            <div class="section-title">
              <h2>Riepilogo ordine</h2>
            </div>
            <div class="summary-box">
              <ul class="summary-list" id="summaryList"></ul>
              <div class="summary-total">
                <span>Totale</span>
                <span id="totalPrice">€ 0.00</span>
              </div>
            </div>

            <div class="form-group">
              <label for="address">Indirizzo consegna</label>
              <input id="address" type="text" placeholder="Via ..., numero, città o GPS" />
            </div>

            <div class="form-group">
              <label for="phone">Telefono</label>
              <input id="phone" type="tel" placeholder="+39 ..." />
            </div>

            <div class="form-group">
              <label for="notes">Note</label>
              <textarea id="notes" placeholder="Senza maionese, citofono, piano, ecc."></textarea>
            </div>

            <div class="form-group">
              <label for="payment">Pagamento</label>
              <select id="payment">
                <option>Contanti alla consegna</option>
                <option>Pagamento online</option>
              </select>
            </div>

            <button class="primary-btn" onclick="submitOrder()">Invia ordine su WhatsApp</button>
          </section>
        </section>

        <section id="staffView" class="hidden">
          <div class="staff-panel">
            <div class="section-title">
              <h2>Dashboard staff</h2>
              <span class="tiny">Codice: 45800</span>
            </div>
            <div id="staffOrders"></div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const STAFF_CODE = '45800';
      const WHATSAPP_NUMBER = '393447513295';

      const menu = [
        { id: 1, name: 'Panino Prosciutto', desc: 'Prosciutto, mozzarella, pomodoro e rucola', price: 6.5, image: 'https://images.unsplash.com/photo-1528735602780-2552fd4a5f5e?auto=format&fit=crop&w=800&q=80' },
        { id: 2, name: 'Panino Diavola', desc: 'Salame piccante, provola e rucola', price: 7.0, image: 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=800&q=80' },
        { id: 3, name: 'Panino Vegetariano', desc: 'Verdure grigliate, scamorza e basilico', price: 6.0, image: 'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80' },
        { id: 4, name: 'Panino Porchetta', desc: 'Porchetta, patate e maionese', price: 7.5, image: 'https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=800&q=80' },
        { id: 5, name: 'Kebab Classico', desc: 'Carne, insalata, cipolla e salsa', price: 8.0, image: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=800&q=80' },
        { id: 6, name: 'Kebab Speciale', desc: 'Carne, cheddar, patatine e salsa', price: 9.0, image: 'https://images.unsplash.com/photo-1559847844-5315695dadae?auto=format&fit=crop&w=800&q=80' },
        { id: 7, name: 'Acqua', desc: '500 ml', price: 1.5, image: 'https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=800&q=80' },
        { id: 8, name: 'Coca Cola', desc: '330 ml', price: 2.5, image: 'https://images.unsplash.com/photo-1622483767028-3f66f2b7420a?auto=format&fit=crop&w=800&q=80' }
      ];

      let cart = {};
      let orders = JSON.parse(localStorage.getItem('le_sodine_orders') || '[]');
      let staffOpen = false;

      function renderMenu() {
        const list = document.getElementById('menuList');
        list.innerHTML = menu.map(item => {
          const qty = cart[item.id] || 0;
          return `
            <div class="menu-item">
              <img src="${item.image}" alt="${item.name}" />
              <div class="menu-info">
                <h3>${item.name}</h3>
                <p>${item.desc}</p>
                <div class="menu-row">
                  <span class="price">€ ${item.price.toFixed(2)}</span>
                  <div class="qty-box">
                    <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                    <span class="qty-value">${qty}</span>
                    <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');

        updateSummary();
      }

      function changeQty(id, delta) {
        cart[id] = (cart[id] || 0) + delta;
        if (cart[id] < 0) cart[id] = 0;
        if (cart[id] === 0) delete cart[id];
        renderMenu();
      }

      function getTotal() {
        return Object.keys(cart).reduce((sum, id) => {
          const item = menu.find(x => x.id === Number(id));
          return sum + (item ? item.price * cart[id] : 0);
        }, 0);
      }

      function updateSummary() {
        const summaryList = document.getElementById('summaryList');
        const totalPrice = document.getElementById('totalPrice');

        const rows = Object.keys(cart).map(id => {
          const item = menu.find(x => x.id === Number(id));
          if (!item) return null;
          const qty = cart[id];
          const subtotal = item.price * qty;
          return `<li><span>${item.name} x${qty}</span><span>€ ${subtotal.toFixed(2)}</span></li>`;
        }).filter(Boolean);

        if (rows.length === 0) {
          summaryList.innerHTML = '<li><span>Nessun prodotto</span><span>€ 0.00</span></li>';
        } else {
          summaryList.innerHTML = rows.join('');
        }

        totalPrice.textContent = `€ ${getTotal().toFixed(2)}`;
      }

      function openStaffPanel() {
        const entered = prompt('Inserisci il codice staff');
        if (entered === null) return;
        if (entered.trim() !== STAFF_CODE) {
          alert('Codice staff non valido');
          return;
        }

        staffOpen = true;
        document.getElementById('customerView').classList.add('hidden');
        document.getElementById('staffView').classList.remove('hidden');
        renderStaffOrders();
      }

      function closeStaffPanel() {
        staffOpen = false;
        document.getElementById('staffView').classList.add('hidden');
        document.getElementById('customerView').classList.remove('hidden');
      }

      function submitOrder() {
        const totalItems = Object.values(cart).reduce((sum, n) => sum + n, 0);
        if (totalItems <= 0) {
          alert('Seleziona almeno un prodotto.');
          return;
        }

        const address = document.getElementById('address').value.trim();
        const phone = document.getElementById('phone').value.trim();
        if (!address || !phone) {
          alert('Inserisci indirizzo e numero di telefono.');
          return;
        }

        const notes = document.getElementById('notes').value.trim();
        const payment = document.getElementById('payment').value;
        const total = `€ ${getTotal().toFixed(2)}`;

        const items = Object.keys(cart).map(id => {
          const item = menu.find(x => x.id === Number(id));
          if (!item) return null;
          return `${item.name} x${cart[id]}`;
        }).filter(Boolean).join(', ');

        const order = {
          id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          items,
          total,
          address,
          phone,
          notes: notes || 'Nessuna nota',
          payment,
          status: 'In attesa'
        };

        orders.unshift(order);
        localStorage.setItem('le_sodine_orders', JSON.stringify(orders));

        const message =
          '*NUOVO ORDINE - LE SODINE*%0A' +
          '🆔 ' + order.id + '%0A' +
          '🥪 Prodotti: ' + order.items + '%0A' +
          '💰 Totale: ' + order.total + '%0A' +
          '📍 Indirizzo: ' + order.address + '%0A' +
          '📞 Telefono: ' + order.phone + '%0A' +
          '📝 Note: ' + order.notes + '%0A' +
          '💳 Pagamento: ' + order.payment;

        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${message}`, '_blank');

        cart = {};
        document.getElementById('address').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('notes').value = '';
        renderMenu();

        alert('Ordine inviato! WhatsApp si aprirà automaticamente.');
      }

      function renderStaffOrders() {
        const box = document.getElementById('staffOrders');

        if (!orders.length) {
          box.innerHTML = '<p style="margin:0;color:#7a6e6a;">Nessun ordine ancora.</p>';
          return;
        }

        box.innerHTML = orders.map((order, index) => {
          const statusClass = order.status === 'In preparazione'
            ? 'status-preparing'
            : order.status === 'Completato'
              ? 'status-complete'
              : 'status-pending';

          return `
            <div class="order-card">
              <div class="order-head">
                <div class="order-id">${order.id}</div>
                <span class="status-badge ${statusClass}">${order.status}</span>
              </div>
              <p><strong>Prodotti:</strong> ${order.items}</p>
              <p><strong>Totale:</strong> ${order.total}</p>
              <p><strong>Indirizzo:</strong> ${order.address}</p>
              <p><strong>Telefono:</strong> ${order.phone}</p>
              <p><strong>Note:</strong> ${order.notes}</p>
              <p><strong>Pagamento:</strong> ${order.payment}</p>
              <div class="status-actions">
                <button class="prep" onclick="updateOrderStatus(${index}, 'In preparazione')">Preparazione</button>
                <button class="done" onclick="updateOrderStatus(${index}, 'Completato')">Completato</button>
              </div>
            </div>
          `;
        }).join('');
      }

      function updateOrderStatus(index, status) {
        orders[index].status = status;
        localStorage.setItem('le_sodine_orders', JSON.stringify(orders));
        renderStaffOrders();
      }

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && staffOpen) {
          closeStaffPanel();
        }
      });

      renderMenu();
      renderStaffOrders();
    </script>
  </body>
</html>

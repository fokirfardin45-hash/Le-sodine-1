<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PWA Score UI</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #dfeaf1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .scene {
      position: relative;
      width: 1280px;
      height: 760px;
      background: linear-gradient(180deg, #dfeaf1 0%, #d2e1eb 100%);
      overflow: hidden;
      border-radius: 0;
    }

    .bg-orb {
      position: absolute;
      width: 980px;
      height: 980px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      left: -300px;
      top: -220px;
      filter: blur(2px);
    }

    .topbar {
      position: absolute;
      left: 60px;
      top: 30px;
    }

    .title {
      font-size: 72px;
      font-weight: 700;
      color: #2f3947;
      letter-spacing: -2px;
      margin: 0;
      line-height: 1;
    }

    .sub {
      margin-top: 18px;
      font-size: 42px;
      color: #3a4654;
      font-weight: 400;
      letter-spacing: -1px;
    }

    .score-row {
      position: absolute;
      top: 190px;
      left: 80px;
      display: flex;
      gap: 110px;
      align-items: flex-start;
    }

    .score-card {
      width: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .ring {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #f6f1f0 0%, #f6f1f0 56%, #e9d4d1 56%, #e9d4d1 58%, #f5f4f2 58%, #f5f4f2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 10px rgba(255,255,255,0.12);
    }

    .ring::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      background: conic-gradient(
        #f26d6d 0deg 260deg,
        #f1d4d0 260deg 360deg
      );
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 18px), #000 0);
              mask: radial-gradient(farthest-side, transparent calc(100% - 18px), #000 0);
    }

    .ring-value {
      position: absolute;
      font-size: 46px;
      font-weight: 700;
      color: #3b4658;
      letter-spacing: -2px;
      z-index: 2;
    }

    .ring-value span {
      font-size: 26px;
      color: #3b4658;
      opacity: 0.9;
    }

    .card-label {
      font-size: 32px;
      color: #3d4a57;
      font-weight: 400;
      letter-spacing: -1px;
      text-align: center;
    }

    .alert {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: #f0a3a3;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 8px rgba(255,255,255,0.15);
    }

    .alert::before {
      content: "!";
      font-size: 120px;
      font-weight: 700;
      color: rgba(255,255,255,0.92);
      line-height: 1;
      transform: translateY(-8px);
    }

    .moon {
      position: absolute;
      right: 80px;
      bottom: 40px;
      width: 420px;
      height: 240px;
      border-radius: 50% 50% 0 0;
      background: rgb(239, 245, 247);
      box-shadow: inset 0 0 0 12px rgba(255,255,255,0.35);
      transform: rotate(8deg);
    }

    .moon::before {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      left: 120px;
      top: 30px;
      box-shadow:
        50px 10px 0 10px rgba(255,255,255,0.7),
        -40px 30px 0 6px rgba(255,255,255,0.75),
        18px 65px 0 18px rgba(255,255,255,0.8);
    }

    .mascot-wrap {
      position: absolute;
      right: 280px;
      bottom: 80px;
      width: 300px;
      height: 260px;
    }

    .body {
      position: absolute;
      left: 54px;
      bottom: 0;
      width: 170px;
      height: 180px;
      background: #dfe9f4;
      border-radius: 60px 60px 30px 30px;
      border: 4px solid rgba(117, 148, 165, 0.35);
      transform: translateY(18px);
      z-index: 2;
    }

    .helmet {
      position: absolute;
      left: 42px;
      top: 18px;
      width: 185px;
      height: 110px;
      border-radius: 50% 50% 45% 45%;
      background: #dceaf7;
      border: 4px solid rgba(117, 148, 165, 0.35);
      z-index: 3;
    }

    .helmet::before {
      content: "";
      position: absolute;
      left: 28px;
      top: 18px;
      width: 130px;
      height: 80px;
      border-radius: 50%;
      background: #caa87d;
      box-shadow: inset 0 0 0 6px rgba(148, 113, 76, 0.4);
    }

    .face {
      position: absolute;
      left: 68px;
      top: 38px;
      width: 90px;
      height: 90px;
      background: #b98d64;
      border-radius: 50%;
      z-index: 4;
      box-shadow: inset 0 0 0 6px rgba(136, 96, 66, 0.3);
    }

    .face::before, .face::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2b2b2b;
      top: 32px;
    }

    .face::before { left: 22px; }
    .face::after { right: 22px; }

    .arm-left, .arm-right {
      position: absolute;
      width: 24px;
      height: 120px;
      background: #dfe9f4;
      border-radius: 20px;
      top: 90px;
      z-index: 1;
    }

    .arm-left { left: 20px; transform: rotate(20deg); }
    .arm-right { right: 20px; transform: rotate(-20deg); }

    .hand {
      position: absolute;
      width: 40px;
      height: 40px;
      background: #d6ae88;
      border-radius: 50%;
      bottom: 40px;
      z-index: 5;
    }

    .hand.left { left: 2px; }
    .hand.right { right: 2px; }

    .flag {
      position: absolute;
      right: 0;
      top: 48px;
      width: 110px;
      height: 80px;
      background: linear-gradient(90deg, #0f5eb4, #0e3f90);
      clip-path: polygon(0 0, 100% 20%, 100% 100%, 0 80%);
      border-radius: 6px;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.2);
      z-index: 6;
    }

    .flag::before {
      content: "PWA";
      position: absolute;
      left: 16px;
      top: 18px;
      color: #fff;
      font-weight: 800;
      font-size: 24px;
      letter-spacing: -1px;
    }

    .flag::after {
      content: "builder";
      position: absolute;
      left: 18px;
      top: 46px;
      color: #fff;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: lowercase;
      opacity: 0.9;
    }

    .logo {
      position: absolute;
      left: 40px;
      bottom: 34px;
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    .owl {
      width: 110px;
      height: 90px;
      position: relative;
      background: #5a3591;
      border-radius: 50px 50px 60px 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 8px rgba(255,255,255,0.12);
    }

    .owl::before,
    .owl::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f3d1b7;
      top: 24px;
    }

    .owl::before { left: 32px; }
    .owl::after { right: 32px; }

    .owl .beak {
      position: absolute;
      width: 18px;
      height: 16px;
      background: #f1c993;
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      bottom: 18px;
    }

    .brand {
      font-size: 72px;
      font-weight: 900;
      line-height: 0.8;
      color: #2c2d31;
      letter-spacing: -3px;
    }

    .brand small {
      display: block;
      font-size: 24px;
      letter-spacing: 1px;
      font-weight: 700;
      color: #2b2d31;
      margin-top: 2px;
      text-transform: lowercase;
    }

    .brand .pwa {
      display: block;
    }

    .brand .builder {
      display: block;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="bg-orb"></div>

    <div class="topbar">
      <div class="title">Le-sodine</div>
      <div class="sub">PWA Score</div>
    </div>

    <div class="score-row">
      <div class="score-card">
        <div class="ring">
          <div class="ring-value">16 <span>/ 46</span></div>
        </div>
        <div class="card-label">Manifest</div>
      </div>

      <div class="score-card">
        <div class="alert"></div>
        <div class="card-label">Service Worker</div>
      </div>

      <div class="score-card">
        <div class="alert"></div>
        <div class="card-label">App Capabilities</div>
      </div>
    </div>

    <div class="logo">
      <div class="owl">
        <div class="beak"></div>
      </div>
      <div class="brand">
        <span class="pwa">PWA</span>
        <span class="builder">builder</span>
      </div>
    </div>

    <div class="moon"></div>

    <div class="mascot-wrap">
      <div class="arm-left"></div>
      <div class="arm-right"></div>
      <div class="hand left"></div>
      <div class="hand right"></div>

      <div class="helmet"></div>
      <div class="face"></div>
      <div class="body"></div>

      <div class="flag"></div>
    </div>
  </div>
</body>
</html>
